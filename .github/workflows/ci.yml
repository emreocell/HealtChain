name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Generate clean lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
          npm ci

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hardhat3-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Static and contract build checks
        run: npm run check

      - name: Runtime dependency audit
        run: npm run audit:runtime

      - name: Critical dependency audit
        run: npm run audit:critical

      - name: API tests
        run: npm run test:api

      - name: Smart contract tests
        run: npm run test:contracts
