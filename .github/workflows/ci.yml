name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependencies
        run: npm install

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Static syntax checks
        run: npm run check

      - name: Runtime dependency audit
        run: npm run audit:runtime

      - name: Critical dependency audit
        run: npm audit --audit-level=critical

      - name: API tests
        run: npm run test:api

      - name: Smart contract tests
        run: npm run test:contracts
