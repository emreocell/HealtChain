name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Generate deterministic lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only

      - name: Commit regenerated lockfile
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile for Hardhat 3"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Static and contract build checks
        run: npm run check

      - name: Runtime dependency audit
        run: npm run audit:runtime

      - name: Critical dependency audit
        run: npm run audit:critical

      - name: API tests
        run: npm run test:api

      - name: Smart contract tests
        run: npm run test:contracts
