<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Medikal Kayıt Sistemi</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script defer src="app.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

  <div class="max-w-3xl mx-auto mt-10 bg-gray-800 p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4 text-center text-blue-400">💾 Medikal Kayıt Sistemi</h1>

    <div class="space-y-3">
      <input id="hastaIsmi" type="text" placeholder="İsim" class="w-full p-2 border border-gray-600 bg-gray-700 text-white rounded placeholder-gray-400" />
      <input id="hastalik" type="text" placeholder="Hastalık" class="w-full p-2 border border-gray-600 bg-gray-700 text-white rounded placeholder-gray-400" />
      <button onclick="kayitEt()" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-2 rounded">Kayıt Et</button>
      <button onclick="veriGetir()" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white py-2 rounded">Verileri Getir</button>
    </div>

    <div class="mt-6">
      <h2 class="text-xl font-semibold text-gray-300">📋 Kayıtlı Bilgiler</h2>
      <pre id="sonuc" class="bg-gray-700 border border-gray-600 mt-2 p-3 rounded text-sm text-green-400 whitespace-pre-wrap"></pre>
    </div>

    <div class="mt-6">
      <h2 class="text-xl font-semibold text-gray-300">🤖 AI Öneri</h2>
      <pre id="aiOneri" class="bg-yellow-100 bg-opacity-10 border border-yellow-600 mt-2 p-3 rounded text-sm text-yellow-300 whitespace-pre-wrap"></pre>
    </div>
  </div>

</body>
</html>
